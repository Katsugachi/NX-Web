name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_engine:
        description: Build the pinned Wasm engine and check artifacts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  engine:
    if: github.event_name == 'workflow_dispatch' && inputs.build_engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y build-essential ninja-build glslang-tools curl patch perl pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/emsdk
            engine/.cache/cpm
          key: emsdk-7.0.1-${{ runner.os }}-${{ hashFiles('engine-patches/*.patch', '.gitmodules') }}
      - run: npm ci
      - run: npm run build:engine
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: nx-web-runtime
          path: web/runtime/
